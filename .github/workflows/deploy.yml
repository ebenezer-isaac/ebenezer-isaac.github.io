name: Build & Deploy Portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # Daily 6am UTC — picks up gist changes
  workflow_dispatch: # Manual trigger (Bob or user)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ebenezer-isaac/portfolio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build
        env:
          LLMC_API_KEY: ${{ secrets.LLMC_API_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Login to GHCR on self-hosted runner
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Deploy portfolio
        run: |
          cd ~/projects/portfolio
          docker compose up -d --force-recreate
          echo "Deployed successfully"

      - name: Health check
        run: |
          sleep 5
          health=$(docker inspect --format='{{.State.Health.Status}}' portfolio 2>/dev/null || echo "unknown")
          echo "Portfolio health: $health"
          if [ "$health" != "healthy" ]; then
            echo "--- Portfolio logs ---"
            docker logs portfolio --tail 20 2>&1 || true
          fi

      - name: Cleanup
        if: always()
        run: docker image prune -f
