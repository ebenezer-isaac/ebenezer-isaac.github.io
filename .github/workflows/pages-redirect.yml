name: GitHub Pages Redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=https://ebenezer-isaac.com">
            <link rel="canonical" href="https://ebenezer-isaac.com">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="https://ebenezer-isaac.com">ebenezer-isaac.com</a>...</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
